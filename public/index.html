<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>敬拜歌曲 Worship Songs</title>
  <meta name="theme-color" content="#7c6af7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="敬拜歌曲" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="header">
  <h1>🎵 敬拜歌曲</h1>
  <div class="header-actions">
    <button class="chord-toggle" id="chordToggle" title="Toggle chords">
      <span class="dot"></span>
      和弦
    </button>
  </div>
</div>

<!-- Install banner (shown when PWA installable) -->
<div class="install-banner hidden" id="installBanner">
  <p><strong>安装应用</strong> — 添加到主屏幕</p>
  <button class="btn btn-primary btn-sm" id="installBtn">安装</button>
</div>

<!-- Welcome screen (no setlist) -->
<div class="welcome" id="welcomeScreen">
  <div class="welcome-icon">🙏</div>
  <h2>敬拜歌曲</h2>
  <p>请向带领者索取敬拜歌单链接</p>
  <p class="text-muted mt-8" style="font-size:0.8rem">Ask your worship leader for the setlist link</p>
</div>

<!-- Song navigator tabs -->
<div class="song-nav hidden" id="songNav"></div>

<!-- Song display -->
<div class="song-view hidden" id="songView"></div>

<script src="/js/app.js"></script>
</body>
</html>
