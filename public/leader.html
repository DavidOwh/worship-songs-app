<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>选歌 — 敬拜歌曲</title>
  <meta name="theme-color" content="#7c6af7" />
  <link rel="manifest" href="/manifest-leader.json" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="header">
  <h1>🎼 选择歌曲</h1>
  <div class="header-actions">
    <a href="/" class="btn btn-ghost btn-sm">会员视图</a>
  </div>
</div>

<div class="category-filter">
  <button class="cat-btn active" data-cat="all">全部</button>
  <button class="cat-btn" data-cat="praise">赞美</button>
  <button class="cat-btn" data-cat="worship">敬拜</button>
  <button class="cat-btn" data-cat="fast">快歌</button>
  <button class="cat-btn" data-cat="dialect">方言</button>
  <button class="cat-btn" data-cat="lifeline">生命之光</button>
</div>

<div class="search-bar" style="padding:8px 16px">
  <input id="searchInput" type="search" placeholder="🔍 搜索歌曲…"
    style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:0.95rem;background:var(--surface);color:var(--text)" />
</div>

<div class="song-list" id="songList">
  <p class="text-muted" style="padding:20px 0;text-align:center">加载中…</p>
</div>

<!-- Fixed setlist panel at bottom -->
<div class="setlist-panel">
  <div class="setlist-header">
    <h3>歌单 <span id="setlistCount" style="color:var(--text-muted);font-weight:400;font-size:0.85rem">（0/8）</span></h3>
    <button class="btn btn-ghost btn-sm" id="clearBtn">清除</button>
  </div>
  <div class="setlist-songs" id="setlistSongs">
    <span class="setlist-empty">尚未选择歌曲</span>
  </div>
  <div class="share-row">
    <button class="btn btn-whatsapp" id="shareBtn" disabled>
      🟢 WhatsApp
    </button>
    <button class="btn btn-telegram" id="shareTelegramBtn" disabled>
      🔵 Telegram
    </button>
    <button class="btn btn-copy" id="copyLinkBtn" disabled>
      📋 复制链接
    </button>
  </div>
</div>

<!-- Preview Modal -->
<div id="previewModal" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.7);align-items:center;justify-content:center;padding:16px">
  <div style="background:var(--surface);border-radius:16px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;padding:24px;box-shadow:0 8px 40px rgba(0,0,0,0.4)">
    <h2 style="margin:0 0 4px;font-size:1.1rem;color:var(--text)">📋 歌单预览</h2>
    <p style="margin:0 0 16px;font-size:0.8rem;color:var(--text-muted)">会众收到的歌单</p>
    <div id="previewList" style="margin-bottom:20px"></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <button id="confirmShareBtn" class="btn btn-whatsapp" style="justify-content:center">
        📲 确认发送 WhatsApp
      </button>
      <button id="closePreviewBtn" class="btn btn-ghost" style="justify-content:center">
        返回修改
      </button>
    </div>
  </div>
</div>

<script src="/js/leader.js"></script>
</body>
</html>
